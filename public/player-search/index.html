<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Search — FantasyForecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #150f0c;
    --bg-panel-raised: #241a13;
    --turf: #3c6e47;
    --turf-dark: #23402a;
    --amber: #f2a63a;
    --cream: #f2e8d5;
    --cream-dim: #cfc3ab;
    --leather-dark: #5e2020;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, rgba(242,166,58,0.12), transparent 55%), var(--bg-base);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    text-align: center;
    padding: 24px;
  }

  .card { max-width: 460px; }

  .badge {
    display: inline-block;
    border: 2px solid var(--turf);
    background: var(--bg-panel-raised);
    color: var(--amber);
    font-family: 'Bungee', cursive;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 8px 16px;
    border-radius: 6px;
    margin-bottom: 22px;
  }

  h1 {
    font-family: 'Bungee', cursive;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 14px;
    text-shadow: 0 3px 0 var(--leather-dark);
  }

  p {
    color: var(--cream-dim);
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 30px;
  }

  a.home-link {
    display: inline-block;
    text-decoration: none;
    color: var(--bg-base);
    background: var(--amber);
    font-weight: 600;
    padding: 12px 26px;
    border-radius: 8px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  a.home-link:hover {
    transform: translateY(-2px);
    opacity: 0.92;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">COMING SOON</div>
    <h1>Player Search</h1>
    <p>Full player profiles, stats, and outlooks are being built out. Check back soon.</p>
    <a class="home-link" href="/">← Back to Home</a>
  </div>
</body>
</html>
